name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:

  # ==========================================
  # 1. TEST
  # ==========================================

  test:

    name: Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest


  # ==========================================
  # 2. BUILD + SCAN + PUSH
  # ==========================================

  build-scan-push:

    name: Build, Scan and Push Docker Image

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------
      # AWS authentication
      # --------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------
      # ECR login
      # --------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------
      # Build image
      # --------------------------------------

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .

      # --------------------------------------
      # Trivy security scan
      # --------------------------------------

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------
      # Push immutable SHA image
      # --------------------------------------

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}


  # ==========================================
  # 3. DEPLOY
  # ==========================================

  deploy:

    name: Deploy to EC2

    needs: build-scan-push

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # --------------------------------------
      # AWS authentication
      # --------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------
      # Find healthy EC2 instances
      # --------------------------------------

      - name: Get EC2 Instances
        id: instances
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |

          echo "Waiting for EC2 instances..."

          for i in {1..30}; do

            INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text)

            COUNT=$(echo "$INSTANCES" | wc -w)

            echo "Found $COUNT InService instance(s)."

            if [ "$COUNT" -ge 2 ]; then
              break
            fi

            echo "Waiting for instances..."
            sleep 10

          done

          if [ "$COUNT" -lt 2 ]; then
            echo "ERROR: Could not find two InService EC2 instances."
            exit 1
          fi

          echo "EC2 instances:"
          echo "$INSTANCES"

          echo "instances=$INSTANCES" >> "$GITHUB_OUTPUT"


      # --------------------------------------
      # Deploy application
      # --------------------------------------

      - name: Deploy to EC2 Instances
        env:
          INSTANCES: ${{ steps.instances.outputs.instances }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "Deploying image:"
          echo "$IMAGE_URI"
          echo "======================================"

          for INSTANCE_ID in $INSTANCES; do

            echo ""
            echo "======================================"
            echo "Deploying to $INSTANCE_ID"
            echo "======================================"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                \"set -e\",
                \"echo 'Logging into ECR...'\",
                \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\",
                \"echo 'Pulling image...'\",
                \"docker pull ${IMAGE_URI}\",
                \"echo 'Stopping old container...'\",
                \"docker stop flask-app || true\",
                \"docker rm flask-app || true\",
                \"echo 'Starting new container...'\",
                \"docker run -d --name flask-app --restart unless-stopped -p 5000:5000 ${IMAGE_URI}\",
                \"echo 'Waiting for application...'\",
                \"sleep 10\",
                \"echo 'Running health check...'\",
                \"curl -f http://localhost:5000/health\"
              ]" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            echo "Waiting for deployment result..."

            STATUS="Pending"

            for i in {1..30}; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text)

              echo "Current status: $STATUS"

              case "$STATUS" in

                Success)

                  echo "Deployment successful on $INSTANCE_ID"
                  break
                  ;;

                Failed|Cancelled|TimedOut)

                  echo "Deployment failed on $INSTANCE_ID"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID"

                  exit 1
                  ;;

                *)

                  sleep 10
                  ;;

              esac

            done

            if [ "$STATUS" != "Success" ]; then

              echo "Deployment timed out on $INSTANCE_ID"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1

            fi

            echo ""
            echo "Deployment completed successfully on $INSTANCE_ID."

            echo "Waiting before deploying to the next instance..."

            sleep 10

          done

          echo ""
          echo "======================================"
          echo "Deployment completed successfully."
          echo "======================================"